# Builds the site and publishes it to GitHub Pages every time you push a change.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
